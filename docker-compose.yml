
services:
  # ==========================================
  # DATABASE - POSTGRESQL
  # ==========================================
  db:
    image: postgres:16
    container_name: gestion-hotel-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ==========================================
  # MICROSERVICE CHAMBRES
  # ==========================================
  chambres-api:
    build: ./services/chambres/backend
    env_file:
      - path: ./.env
      - path: ./services/chambres/.env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - chambres_media:/app/media
    restart: unless-stopped

