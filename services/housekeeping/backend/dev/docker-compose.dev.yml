# Environnement de développement AUTONOME du service housekeeping :
# PostgreSQL + housekeeping + faux services chambres/users.
# Lancement : docker compose -f docker-compose.dev.yml up --build
name: housekeeping-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: riadmanager
      POSTGRES_USER: riad
      POSTGRES_PASSWORD: change_me
    ports:
      - "5433:5432"   # accès depuis l'hôte (tests, IntelliJ) ; 5433 pour ne pas heurter un PostgreSQL local sur 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riad -d riadmanager"]
      interval: 3s
      timeout: 3s
      retries: 20

  mock:
    image: python:3.12-slim
    command: python /app/mock_services.py
    volumes:
      - ./mock_services.py:/app/mock_services.py:ro
    environment:
      INTERNAL_API_TOKEN: change_me_interne
      PORT: "8000"
    ports:
      - "9000:8000"
    networks:
      default:
        aliases:        # housekeeping les joint avec les mêmes noms que les vrais services
          - chambres-backend
          - users-backend

  housekeeping:
    build: ..
    environment:
      POSTGRES_DB: riadmanager
      POSTGRES_USER: riad
      POSTGRES_PASSWORD: change_me
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_SCHEMA: housekeeping
      JWT_SECRET: change_me_commun_a_tous_les_services
      INTERNAL_API_TOKEN: change_me_interne
      CHAMBRES_API_URL: http://chambres-backend:8000
      USERS_API_URL: http://users-backend:8000
      DJANGO_DEBUG: "1"
    depends_on:
      db:
        condition: service_healthy
      mock:
        condition: service_started
    ports:
      - "8003:8000"
    restart: unless-stopped

volumes:
  pgdata:
